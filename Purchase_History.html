<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BusSheba – Purchase History</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:'Nunito',sans-serif;
  background:#e8eef7;
}

/* FULL WIDTH CONTAINER */
.container{
  width:100%;
  max-width:1440px;
  margin:auto;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  padding:40px 60px;
  color:#fff;
}

.header h1{
  font-size:28px;
  font-weight:800;
}

.header p{
  font-size:14px;
  opacity:.8;
}

/* SEARCH */
.search-wrap{
  padding:0 60px;
  margin-top:-20px;
}

.search-box{
  background:#fff;
  border-radius:14px;
  padding:16px 20px;
  display:flex;
  align-items:center;
  gap:10px;
  box-shadow:0 5px 20px rgba(37,99,235,0.12);
}

.search-box input{
  border:none;
  outline:none;
  font-size:15px;
  flex:1;
}

/* TABS */
.tabs{
  display:flex;
  gap:10px;
  padding:20px 60px;
}

.tab{
  padding:10px 22px;
  border-radius:25px;
  font-size:14px;
  font-weight:700;
  border:2px solid #e5e7eb;
  background:#fff;
  cursor:pointer;
}

.tab.active{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

/* LIST GRID */
.ticket-list{
  padding:10px 60px 40px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

/* CARD */
.ticket-card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  display:flex;
  align-items:center;
  gap:15px;
  box-shadow:0 4px 15px rgba(0,0,0,0.06);
  transition:.2s;
}

.ticket-card:hover{
  transform:translateY(-3px);
}

.bus-icon{
  width:50px;
  height:50px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
}

.valid-bg{background:#eff6ff;}
.used-bg{background:#f0fdf4;}
.expired-bg{background:#f3f4f6;}

.ticket-info{
  flex:1;
}

.ticket-route{
  font-size:16px;
  font-weight:800;
}

.ticket-meta{
  font-size:13px;
  color:#6b7280;
  margin-top:6px;
}

.price{
  font-weight:700;
}

.badge{
  padding:6px 14px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
}

.badge-valid{background:#dbeafe;color:#1d4ed8;}
.badge-used{background:#dcfce7;color:#15803d;}
.badge-expired{background:#f3f4f6;color:#9ca3af;}

/* RESPONSIVE */
@media(max-width:900px){
  .ticket-list{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Purchase History</h1>
    <p>Your past journeys</p>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      🔍 <input type="text" placeholder="Search routes...">
    </div>
  </div>

  <div class="tabs">
    <button class="tab active">All</button>
    <button class="tab">Valid</button>
    <button class="tab">Used</button>
    <button class="tab">Expired</button>
  </div>

  <div class="ticket-list">

    <div class="ticket-card">
      <div class="bus-icon valid-bg">🚌</div>
      <div class="ticket-info">
        <div class="ticket-route">Mirpur → Motijheel</div>
        <div class="ticket-meta">Today · Seat 2B · <span class="price">৳70</span></div>
      </div>
      <span class="badge badge-valid">Valid</span>
    </div>

    <div class="ticket-card">
      <div class="bus-icon used-bg">🚌</div>
      <div class="ticket-info">
        <div class="ticket-route">Uttara → Farmgate</div>
        <div class="ticket-meta">Yesterday · Seat 4A · <span class="price">৳25</span></div>
      </div>
      <span class="badge badge-used">Used</span>
    </div>

    <div class="ticket-card">
      <div class="bus-icon expired-bg">🚌</div>
      <div class="ticket-info">
        <div class="ticket-route">Gulshan → Sadarghat</div>
        <div class="ticket-meta">3 days ago · Seat 1C · <span class="price">৳45</span></div>
      </div>
      <span class="badge badge-expired">Expired</span>
    </div>

  </div>

</div>

</body>
</html>
