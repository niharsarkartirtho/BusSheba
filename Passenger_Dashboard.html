<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BusSheba Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Nunito',sans-serif;
  background:#eef3fb;
}

/* MAIN CONTAINER */
.container{
  width:100%;
  max-width:1440px;
  margin:auto;
  padding:20px 60px;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  border-radius:16px;
  padding:30px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#fff;
}

.header-left h1{
  font-size:26px;
  font-weight:800;
}

.header-left p{
  font-size:14px;
  opacity:.8;
}

.header-right{
  display:flex;
  gap:20px;
  font-size:22px;
}

/* FIND BUS CARD */
.find-card{
  margin-top:30px;
  background:linear-gradient(135deg,#2f6fed,#4a90e2);
  border-radius:20px;
  padding:30px;
  color:#fff;
}

.find-title{
  font-size:14px;
  font-weight:700;
  margin-bottom:15px;
  opacity:.9;
}

.form{
  display:grid;
  grid-template-columns:1fr 1fr 1fr auto;
  gap:15px;
  align-items:center;
}

.input{
  background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.25);
  border-radius:10px;
  padding:14px;
  color:#fff;
}

.input::placeholder{color:#e5e7eb;}

.swap{
  width:45px;
  height:45px;
  border-radius:50%;
  background:rgba(255,255,255,0.2);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.search-btn{
  grid-column:1/-1;
  margin-top:10px;
  padding:16px;
  border:none;
  border-radius:10px;
  background:#ff8a00;
  color:#fff;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
}

/* BUS LIST */
.section-title{
  margin-top:30px;
  margin-bottom:15px;
  font-weight:700;
}

.bus-list{
  display:flex;
  flex-direction:column;
  gap:15px;
}

/* CARD */
.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

.card-left{
  display:flex;
  gap:15px;
  align-items:center;
}

.icon{
  width:50px;
  height:50px;
  background:#eaf2ff;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.route{
  font-weight:800;
}

.meta{
  font-size:13px;
  color:#6b7280;
}

.price{
  font-weight:800;
  color:#2f6fed;
}

.seat{
  font-size:12px;
  color:green;
}

/* RESPONSIVE */
@media(max-width:900px){
  .form{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <h1>🚌 BusSheba</h1>
      <p>Passenger Dashboard</p>
    </div>
    <div class="header-right">
      🔔 👤
    </div>
  </div>

  <!-- FIND BUS -->
  <div class="find-card">
    <div class="find-title">FIND A BUS</div>

    <div class="form">
      <input class="input" placeholder="📍 From Stop...">
      <input class="input" placeholder="🏁 To Stop...">
      <input class="input" placeholder="📅 Select travel date">
      <div class="swap">⇅</div>

      <button class="search-btn">🔍 Search Buses</button>
    </div>
  </div>

  <!-- BUS LIST -->
  <div class="section-title">Available Buses</div>

  <div class="bus-list">

    <div class="card">
      <div class="card-left">
        <div class="icon">🚌</div>
        <div>
          <div class="route">Mirpur – Motijheel Express</div>
          <div class="meta">8:30 AM · 14 stops · 45 min</div>
        </div>
      </div>
      <div>
        <div class="price">৳ 35</div>
        <div class="seat">12 seats left</div>
      </div>
    </div>

    <div class="card" style="border:2px solid #2f6fed;">
      <div class="card-left">
        <div class="icon">🚌</div>
        <div>
          <div class="route">Uttara – Farmgate Direct</div>
          <div class="meta">8:45 AM · 8 stops · 30 min</div>
        </div>
      </div>
      <div>
        <div class="price">৳ 25</div>
        <div class="seat" style="color:orange;">3 seats left</div>
      </div>
    </div>

  </div>

</div>

</body>
</html>
