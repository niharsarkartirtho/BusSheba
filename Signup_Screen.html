<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusSheba Registration</title>
    <style>
        :root {
            --primary-blue: #1565C0;
            --accent-orange: #EF6C00;
            --bg-gray: #F5F7FA;
            --text-gray: #757575;
            --border-color: #E0E0E0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Header Styling */
        header {
            background-color: var(--primary-blue);
            color: white;
            padding: 25px 20px;
            position: relative;
        }

        header h1 { margin: 0; font-size: 24px; }
        header p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }

        .logo-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--accent-orange);
            padding: 8px;
            border-radius: 8px;
            font-size: 20px;
        }

        /* Form Styling */
        form { padding: 25px 20px; }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            text-transform: uppercase;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-gray);
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #FAFAFA;
            color: #333;
        }

        /* Row Layout for Gender/DOB */
        .row {
            display: flex;
            gap: 15px;
        }
        .row .form-group { flex: 1; }

        /* Mobile Number & OTP Section */
        .otp-group {
            display: flex;
            gap: 10px;
        }
        .otp-group input { flex: 2; }
        
        .btn-otp {
            flex: 1;
            background-color: var(--accent-orange);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Main Action Button */
        .btn-submit {
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--primary-blue);
        }

        .footer-link a {
            text-decoration: none;
            font-weight: bold;
            color: var(--primary-blue);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Create Account</h1>
        <p>BusSheba Registration</p>
        <div class="logo-box">🚌</div>
    </header>

    <form>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" placeholder="your@email.com">
        </div>

        <div class="row">
            <div class="form-group">
                <label>Gender</label>
                <select>
                    <option>Select</option>
                    <option>Male</option>
                    <option>Female</option>
                </select>
            </div>
            <div class="form-group">
                <label>Date of Birth</label>
                <input type="text" placeholder="DD/MM/YY">
            </div>
        </div>

        <div class="form-group">
            <label>NID Number</label>
            <input type="text" placeholder="National ID number">
        </div>

        <div class="form-group">
            <label>Mobile Number</label>
            <div class="otp-group">
                <input type="text" placeholder="01XXXXXXXXX">
                <button type="button" class="btn-otp">Get OTP</button>
            </div>
        </div>

        <div class="form-group">
            <label>User Type</label>
            <select>
                <option>Select role</option>
                <option>Passenger</option>
                <option>Driver</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Create Account</button>

        <div class="footer-link">
            Already have an account? <a href="#">Sign In</a>
        </div>
    </form>
</div>

</body>
</html>
