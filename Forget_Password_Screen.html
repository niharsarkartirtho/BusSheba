<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusSheba - Forgot Password</title>
</head>
<body>

    <header class="app-header">
        <button type="button" class="back-btn">←</button>
        <h1>Forgot Password</h1>
    </header>

    <main class="container">
        
        <section class="recovery-card">
            <div class="key-icon">🔑</div>
            <h2>Password Recovery</h2>
            <p>Enter your email to receive a reset code</p>
        </section>

        <nav class="stepper">
            <div class="step active">
                <span class="step-icon">📧</span> Email
            </div>
            <div class="step disabled">
                <span class="step-icon">🔢</span> Code
            </div>
            <div class="step disabled">
                <span class="step-icon">⚙️</span> New Password
            </div>
        </nav>

        <form action="#">
            
            <div class="form-group">
                <label for="email">EMAIL ADDRESS</label>
                <div class="input-wrapper">
                    <span class="icon">✉️</span>
                    <input type="email" id="email" placeholder="your@email.com">
                </div>
            </div>

            <button type="button" class="btn-orange">Send Reset Code</button>

            <div class="separator">
                <span>After receiving code</span>
            </div>

            <div class="form-group">
                <label for="code">VERIFICATION CODE</label>
                <input type="text" id="code" placeholder="•  •  •  •  •  •" class="code-input">
            </div>

            <div class="form-group">
                <label for="new-password">NEW PASSWORD</label>
                <div class="input-wrapper">
                    <span class="icon">🔒</span>
                    <input type="password" id="new-password" placeholder="Min. 8 characters">
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-password">CONFIRM NEW PASSWORD</label>
                <div class="input-wrapper">
                    <span class="icon">🔒</span>
                    <input type="password" id="confirm-password" placeholder="Re-enter password">
                </div>
            </div>

            <button type="submit" class="btn-blue">Submit → Reset Password</button>

        </form>
    </main>

</body>
</html>
